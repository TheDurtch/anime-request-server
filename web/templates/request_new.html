{{define "title"}}New Request{{end}}

{{define "content"}}
<div style="max-width:600px; margin:1.5rem auto;">
    <h1 style="margin-bottom:1rem;">New Request</h1>
    <div class="card">
        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}

        <form method="POST" action="/requests/new">
            <div class="form-group">
                <label for="name">Show Name</label>
                <input type="text" id="name" name="name" class="form-control" required autofocus value="{{.Name}}">
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="current_future" {{if eq .Category "current_future"}}selected{{end}}>Current / Future</option>
                    <option value="finished_airing" {{if eq .Category "finished_airing"}}selected{{end}}>Finished Airing</option>
                </select>
            </div>
            {{if .User.IsModOrAdmin}}
            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" class="form-control">
                    {{range .Statuses}}
                    <option value="{{.}}" {{if eq (printf "%s" .) $.Status}}selected{{end}}>{{.}}</option>
                    {{end}}
                </select>
            </div>
            <div class="form-group">
                <label>Server Destinations (select multiple)</label>
                {{range .ServerDestinations}}
                <div style="margin:0.25rem 0;">
                    <label style="display:inline; font-weight:normal;">
                        <input type="checkbox" name="server_destination_ids" value="{{.ID}}"
                            {{if index $.SelectedDestIDs (printf "%s" .ID)}}checked{{end}}
                            style="margin-right:0.5rem;">
                        {{.Name}}
                    </label>
                </div>
                {{end}}
                {{if not .ServerDestinations}}
                <p style="color:var(--text-muted); font-size:0.9rem;">No server destinations available. Create one in the admin panel.</p>
                {{end}}
            </div>
            <div class="form-group">
                <label for="anidb_url">AniDB URL</label>
                <input type="url" id="anidb_url" name="anidb_url" class="form-control" value="{{.AnidbURL}}">
            </div>
            {{end}}
            <div style="display:flex; gap:0.5rem;">
                <button type="submit" class="btn btn-primary">Submit Request</button>
                <a href="/" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
